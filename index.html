<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluencyForge AI — Personal English Communication Coach</title>
    <meta
      name="description"
      content="Personal AI English communication coach with strict grammar correction, Malayalam explanations, voice practice, and structured daily fluency tasks."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ff_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
